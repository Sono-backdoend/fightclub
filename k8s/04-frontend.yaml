apiVersion: apps/v1
kind: Deployment
metadata:
  name: sono-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sono-frontend
  template:
    metadata:
      labels:
        app: sono-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: sono-frontend
          image: sono-frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sono-frontend
spec:
  type: NodePort
  selector:
    app: sono-frontend
  ports:
    - port: 80
      targetPort: 3000
