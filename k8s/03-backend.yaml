apiVersion: apps/v1
kind: Deployment
metadata:
  name: sono-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sono-backend
  template:
    metadata:
      labels:
        app: sono-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
        - name: migrate
          image: sono-backend:1.0
          imagePullPolicy: IfNotPresent
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom:
            - configMapRef:
                name: sono-config
            - secretRef:
                name: sono-secrets
      containers:
        - name: sono-backend
          image: sono-backend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: sono-config
            - secretRef:
                name: sono-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sono-backend
spec:
  selector:
    app: sono-backend
  ports:
    - port: 3001
      targetPort: 3001
